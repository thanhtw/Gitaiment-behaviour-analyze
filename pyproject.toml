[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitainment-analysis"
version = "0.1.0"
description = "Reproducible analysis of Gitainment learning behavior and transitions"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0,<3", "numpy>=1.24,<3", "scipy>=1.10,<2",
  "scikit-learn>=1.3,<2", "matplotlib>=3.7,<4", "networkx>=3,<4",
  "statsmodels>=0.14,<1", "threadpoolctl>=3,<4", "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
reports = ["python-docx>=1.1,<2", "reportlab>=4,<5"]
spss = ["pyreadstat>=1.2,<2"]

[project.scripts]
gitainment-analysis = "gitainment_analysis.run_analysis:main"
gitainment-export-anova = "gitainment_analysis.reporting.table9:main"
gitainment-cluster-report = "gitainment_analysis.reporting.cluster_report:main"

[tool.setuptools.packages.find]
where = ["src"]
